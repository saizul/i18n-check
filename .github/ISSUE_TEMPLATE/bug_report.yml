name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please do not paste real secrets, tokens or private files.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command or code you ran, and the output you got.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest reproduction
      description: The smallest input that shows the problem (a few lines of a file is usually enough).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: i18n-check version
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version and OS
      placeholder: 'Node 22.12, Ubuntu 24.04'
    validations:
      required: true
